{% extends 'base.html' %}
{% block title %}{{ '编辑物料' if row else '新增物料' }}{% endblock %}
{% block h1 %}{{ '编辑物料' if row else '新增物料' }}{% endblock %}
{% block sub %}期初结存 = 建账时的库存数{% endblock %}
{% block body %}
<form method="post" class="card">
  <label>物料名称 *</label>
  <input name="name" value="{{row.name if row}}" required>
  <label>料号</label>
  <input name="code" value="{{row.code if row}}">
  <div class="grid2">
    <div><label>类型</label><input name="category" value="{{row.category if row}}" placeholder="有胶基材/无胶压延…"></div>
    <div><label>规格（米）</label><input name="spec" value="{{row.spec if row}}"></div>
  </div>
  <div class="grid2">
    <div><label>宽幅</label><input name="width" value="{{row.width if row}}" inputmode="numeric"></div>
    <div><label>单位</label><input name="unit" value="{{row.unit if row else '平米'}}"></div>
  </div>
  <label>供应商</label>
  <input name="supplier" value="{{row.supplier if row}}">
  <div class="grid2">
    <div><label>期初结存</label><input type="number" step="0.01" name="opening" inputmode="decimal"
      value="{{ '0' if not row else '%g'|format(row.opening) }}"></div>
    <div><label>安全库存（预警值）</label><input type="number" step="0.01" name="safety" inputmode="decimal"
      value="{{ '0' if not row else '%g'|format(row.safety) }}"></div>
  </div>
  <label>状态</label>
  <select name="status">
    {% for s in ['常用','不常用','呆滞'] %}
    <option {{'selected' if row and row.status==s}}>{{s}}</option>{% endfor %}
  </select>
  <button type="submit">保存</button>
</form>
{% if row %}
<a class="btn r s" href="{{url_for('material_del',mid=row.id)}}" onclick="return confirm('删除该物料？有单据时改为停用')">删除 / 停用</a>
{% endif %}
<a class="btn o s" href="{{url_for('materials')}}">返回列表</a>
{% endblock %}
