name: 打包 Windows exe

# 为什么需要这个：PyInstaller 不能交叉编译，
# 想出 Windows 的 .exe 就得在 Windows 上跑。
# 推到 GitHub 后，这里用官方 windows 机器帮你打包好，
# 直接下载 exe，不用自己装 Python。

on:
  push:
    tags: ['v*']              # 打 v1.0 这样的标签时触发
  workflow_dispatch:          # 也可以在网页上手动点“运行”

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # 允许上传 Release 附件

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        run: pyinstaller warehouse.spec --noconfirm --clean

      - name: 检查产物
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/仓库管理系统.exe" || (echo "没找到 exe" && exit 1)

      - name: 压缩
        shell: bash
        run: |
          cd dist
          7z a -y ../仓库管理系统-windows.zip "仓库管理系统.exe" || \
            powershell -Command "Compress-Archive -Path '仓库管理系统.exe' -DestinationPath '../仓库管理系统-windows.zip'"

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 仓库管理系统 ${{ github.ref_name }}
          body: |
            ## 仓库管理系统 ${{ github.ref_name }}

            下载 **仓库管理系统-windows.zip**，解压后双击 `仓库管理系统.exe` 即可使用，
            会自动打开独立窗口（没有浏览器地址栏）。

            完整内置桌面级表格新引擎，跟表格相关的功能（图表、透视表、条件格式）都在。

            **重要：**
            - 数据保存在 exe 旁边的 `warehouse.db`，换电脑时把这个文件一起拷走
            - 同目录的 `.bak` 是自动备份，出问题改名回 `warehouse.db` 可还原
            - 关掉黑窗口即可停止服务
            - 杀毒软件可能误报，加入白名单即可（PyInstaller 程序通病）
          files: 仓库管理系统-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
