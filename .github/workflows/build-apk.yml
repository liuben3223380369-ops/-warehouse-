name: 打包 Android APK

# Android 官方构建链（Gradle + Android SDK）在 Linux 上跑，
# 推 tag 或手动点“运行”都会触发，产物直接挂到 Release。
#
# 思路：APK 里用 ChaQuopy 跑同一套 Python（wh/ 那套代码一行不改），
# 系统 WebView 打开本机 Flask 服务，所以手机端功能与电脑端一致。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      with_univer:
        description: '内置桌面级表格新引擎（默认开，约 12MB；关掉可减小体积）'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          set -e
          # 官方 ubuntu 镜像自带 Android SDK。
          # 之前用的 android-actions/setup-android 会联网整包更新，
          # 经常在这一步超时或授权失败，改为直接用镜像自带的 SDK。
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK"             >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK"         >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools"           >> $GITHUB_PATH
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          echo "SDK 目录: $SDK"
          ls "$SDK" || true
          # 自动同意授权协议，并补齐编译需要的组件
          for SM in "$(command -v sdkmanager || true)" \
                    "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                    "$SDK/tools/bin/sdkmanager"; do
            if [ -n "$SM" ] && [ -x "$SM" ]; then
              echo "使用 sdkmanager: $SM"
              yes 2>/dev/null | "$SM" --licenses > /dev/null 2>&1 || true
              "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -15 || true
              break
            fi
          done
          echo "--- 已装平台 ---"
          ls "$SDK/platforms"    2>/dev/null || true
          ls "$SDK/build-tools"  2>/dev/null || true

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: 查看构建环境
        run: |
          java -version 2>&1 | head -3
          gradle --version | head -6
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: 把 Python 源码放进 Android 工程
        run: |
          set -e
          mkdir -p android/app/src/main/python
          cp -r wh android/app/src/main/python/
          cp -r templates android/app/src/main/python/
          cp -r static android/app/src/main/python/
          cp run.py android_entry.py android/app/src/main/python/
          # 默认完整打包：表格新引擎（static/univer，约 12MB）一并打进去，
          # 手机端跟电脑端功能完全一致。
          # 只有在手动点「运行工作流」时显式把 with_univer 取消勾选，才做精简。
          if [ "${{ github.event.inputs.with_univer }}" = "false" ]; then
            rm -rf android/app/src/main/python/static/univer
            echo "[i] 已精简：不带新引擎"
          else
            echo "[i] 完整包：带新引擎"
          fi
          du -sh android/app/src/main/python

      - name: 同步版本号（跟随 tag，避免 APK 版本停在旧值）
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          # 手动运行工作流时没有 tag，就退回读代码里的 __version__
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then
            VER="$(grep -m1 '__version__' wh/__init__.py | tr -cd '0-9.')"
          fi
          CODE="$(echo "$VER" | tr -d '.' | tr -cd '0-9')"
          [ -z "$CODE" ] && CODE=1
          echo "版本名=$VER  版本号=$CODE"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '$VER'/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 构建 APK
        run: |
          set -e
          set -o pipefail          # 不然 gradle 失败会被 tail 吞掉，步骤显示成功
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tail -100
          echo "=== 产物目录 ==="
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || true
          ls -la android/app/build/outputs/ 2>/dev/null || true

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/*/*.apk out/ 2>/dev/null || true
          ls -la out
          test -n "$(ls -A out)" || (echo "没找到 APK" && exit 1)
          # 统一文件名，方便 Release 里一眼认出
          for f in out/*.apk; do
            case "$f" in
              out/仓库管理系统-android.apk) ;;
              *) mv "$f" out/仓库管理系统-android.apk ;;
            esac
            break
          done
          ls -la out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 仓库管理系统-android
          path: out/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 仓库管理系统 ${{ github.ref_name }}
          body: |
            ## 仓库管理系统 ${{ github.ref_name }}

            - **Windows**：下载 `仓库管理系统-windows.zip`，解压后双击 `仓库管理系统.exe`
            - **Android**：下载 `仓库管理系统-android.apk`，安装后直接打开

            两个平台用的是同一套业务代码，功能完全一致（含桌面级表格新引擎）。
            Android 首次启动需要把内置资源释放到手机存储，约 12MB，请耐心等待十几秒。

            **数据说明：**
            - Windows：数据保存在 exe 旁的 `warehouse.db`，换电脑时一起拷走
            - Android：数据保存在 App 私有目录，卸载会清空，重要数据请先在电脑端导出
          files: |
            out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
